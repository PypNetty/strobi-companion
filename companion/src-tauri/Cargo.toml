[package]
name = "desktop-companion"
version = "0.1.0"
description = "A local desktop companion powered by the Avatar Lab engine"
authors = ["PypNetty"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "desktop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
